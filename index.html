<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKE Favorite Picker</title>
<style>
body {
    background:#FFF;
    color:#000;
    font-family:verdana, sans-serif;
    font-size:10pt;
    margin:0;
    padding:10px;
}

a:link, a:visited {
    color:#008;
    font-weight:bold;
    text-decoration:none;
}

a:active, a:hover {
    color:#ACF;
}

.info {
    font-weight:bold;
}

button {
    font-family:inherit;
    cursor:pointer;
    border:0;
    border-radius:3px;
    padding:0.3em 0.5em;
    background:#CCC;
    color:#000;
}

button:hover {
    background:#DDD;
}

button.disabled {
    background:#DDD;
    color:#888;
    cursor:not-allowed;
}

button.disabled:hover {
    background:#DDD;
}

#container {
    position:relative;
    margin-left:-10px;
    margin-right:-10px;
    padding:10px;
    overflow:hidden;
}

@media (min-width:1024px) {
    /* Put the found favorites beside the picking div when the window is sufficiently large */
    #picking {
        float:left;
        width:636px;
    }

    #secondary {
        margin-left:646px;
    }
}

@media (min-width:1300px) {
    /* Once we get to the point where 636px is less than half of the width of the screen, make the picking div just take up half */
    #picking {
        width:50%;
    }

    #secondary {
        margin-left:51%;
    }
}

#pick {
    background:#58F;
    color:#FFF;
    font-size:larger;
    font-weight:bold;
    width:6em;
    border-radius:5px;
    margin-right:10px;
}

#pick.disabled {
    background:#ACF;
}

#pick:hover {
    background:#ACF;
}

.item-list {
    padding:0;
    list-style-type:none;
    line-height:100px;
}

.item-list li {
    margin:0;
    display:inline-block;
    height:100px;
    width:100px;
    line-height:100px;
    border:3px solid transparent;
    text-align:center;
    position:relative;
    vertical-align:top;
    overflow:hidden;
    border-radius:100%;
    background:#F7F7F7;
    color:#000;
}

.item-list li img {
    vertical-align:middle;
    max-height:100%;
    max-width:100%;
}

.item-list li span {
    display:inline-block;
    vertical-align:middle;
    line-height:1.2;
}

@media (max-width:636px) {
    .item-list {
        line-height:75px;
    }

    .item-list li {
        line-height:75px;
        height:75px;
        width:75px;
    }
}

@media (max-width:423px) {
    .item-list {
        line-height:50px;
    }

    .item-list li {
        line-height:50px;
        height:50px;
        width:50px;
    }
}

#evaluating li {
    cursor:pointer;
}

#favorites li {
    cursor:default;
}

.item-list li:hover {
    background:#CDF;
}

.item-list.sorting li:hover {
    background:#F7F7F7;
}

#evaluating li.selected {
    border:3px solid #7AC;
}

#evaluating, #buttons {
    text-align:center;
    margin:auto;
}

#evaluating li.notice {
    width:auto;
    height:auto;
    max-width:260px;
    margin:auto;
    background:#F7F7F7;
    border-radius:10px;
    padding:30px 30px;
    color:#000;
    text-align:center;
    line-height:1.4;
    cursor:auto;
    font-size:10pt;
}

#buttons {
    margin-top:30px;
    position:relative;
    z-index:3;
}

.item-list {
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
}

.item-list li {
    width: 200px;
    height: 340px;
    display: flex;
    flex-direction: column;
    border: 3px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: #181818;
    box-sizing: border-box;
}

.nikke-image-wrap {
    width: 100%;
    height: 290px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background:
        radial-gradient(circle at center 65%, #303030 0%, #181818 50%, #0d0d0d 100%);
}

.item-list li img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    display: block;
    transform-origin: center bottom;
    transition: transform 0.15s ease, filter 0.15s ease;
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
}

.nikke-name {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 8px;
    color: white;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.1;
    text-align: center;
    background: #222;
    box-sizing: border-box;
}

#evaluating li img {
    transition: transform 0.15s ease, filter 0.15s ease;
}

#evaluating li:hover img {
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.6));
}

#evaluating li.selected {
    border-color: #ffcc00;
}

body {
    background: #101014;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

.site-header {
    max-width: 900px;
    margin: 0 auto 24px;
    text-align: center;
}

.site-header h1 {
    margin-bottom: 8px;
    font-size: 30px;
}

.site-header p {
    color: #bdbdc7;
    line-height: 1.5;
}

#progress {
    color: #ffcc00;
    font-weight: bold;
}

#secondary h2 {
    color: #eeeeee;
}

button {
    padding: 8px 14px;
    border-radius: 6px;
    background: #2c2c34;
    color: #eeeeee;
    font-weight: bold;
}

button:hover {
    background: #41414c;
}

#pick {
    background: #536dfe;
}

#pick:hover {
    background: #7185ff;
}

#favorites {
    gap: 8px;
}

#favorites li {
    width: 120px;
    height: 200px;
    border-radius: 8px;
}

#favorites li img {
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
}

#favorites .nikke-name {
    height: 35px;
    padding: 3px 4px;
    font-size: 11px;
}

#favorites .nikke-image-wrap {
    height: 165px;
}

/* Mobile layout */

@media (max-width: 636px) {
    .site-header h1 {
        font-size: 24px;
    }

    #container {
        margin-left: 0;
        margin-right: 0;
        padding: 0;
    }

    #evaluating {
        gap: 8px;
    }

    #evaluating li {
        width: 160px;
        height: 280px;
    }

    #evaluating .nikke-image-wrap {
        height: 235px;
    }

    #evaluating .nikke-name {
        height: 45px;
        font-size: 12px;
    }
}

@media (max-width: 423px) {
    #evaluating li {
        width: 145px;
        height: 255px;
    }

    #evaluating .nikke-image-wrap {
        height: 215px;
    }

    #evaluating .nikke-name {
        height: 40px;
        font-size: 11px;
    }

    #buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
    }

    #buttons button {
        margin: 0;
    }
}
</style>
</head>
<body>
<header class="site-header">
    <h1>NIKKE Favorite Picker</h1>
    <p>
        Select one or more Nikkes you prefer, then press <strong>Pick</strong>.
        If you cannot decide, press <strong>Pass</strong>.
    </p>
    <p id="progress"></p>
</header>

<div id="container">

<div id="picking">
<ul id="evaluating" class="item-list">
</ul>

<p id="buttons">
    <button id="pick">Pick</button>
    <button id="pass">Pass</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="reset">Reset</button>
</p>
</div>

<div id="secondary">
<h2>Found favorites</h2>

<ol id="favorites" class="item-list">
</ol>
</div>
</div>
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="picker.js"></script>
<script src="picker-ui.js"></script>
<script src="nikke-data.js"></script>
<script>
'use strict';

var myPicker = new picker.Picker({
    items: items,
    localStorageKey: 'nikke-favorite-picker-state',
    historyLength: 50,

    defaultSettings: {
        minBatchSize: 2,
        maxBatchSize: 8
    }
});

var pickerUI = new PickerUI(myPicker, {
    elements: {
        pick: '#pick',
        pass: '#pass',
        undo: '#undo',
        redo: '#redo',
        reset: '#reset',
        evaluating: '#evaluating',
        favorites: '#favorites'
    },

    onUpdate: function() {
    var ranked = this.picker.getFavorites().length;
    var total = items.length;

    $('#progress').text(
        ranked + ' of ' + total + ' Nikkes ranked'
    );
},

    getItemElem: function(item, settings) {
        var card = $('<li></li>');

        if (item.image) {
    var imageWrap = $('<div></div>')
        .addClass('nikke-image-wrap');

    var image = $('<img>')
        .attr('loading', 'lazy')
        .attr('decoding', 'async')
        .attr('src', item.image)
        .attr('alt', item.name);

    var imageScale = item.imageScale || 1;
    var imageX = item.imageX || '0%';
    var imageY = item.imageY || '0%';

    image.css(
        'transform',
        'translate(' + imageX + ', ' + imageY + ') scale(' + imageScale + ')'
);

    imageWrap.append(image);
    card.append(imageWrap);
}

        var name = $('<div></div>')
            .addClass('nikke-name')
            .text(item.name);

        card.append(name);

        return card;
    }
});

pickerUI.initialize();

</script>
</body>
</html>
